services:
  postgres:
    image: postgres:17-alpine
    container_name: manifest-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:1.9.1
    container_name: manifest-temporal
    restart: unless-stopped

    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --namespace
      - ${TEMPORAL_NAMESPACE:-default}
      - --db-filename
      - /home/temporal/temporal.db

    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"

    volumes:
      - temporal-data:/home/temporal

    healthcheck:
      test: ["CMD", "temporal", "--address", "127.0.0.1:7233", "operator", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres-data:
  temporal-data:
