apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentreport-worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: incidentreport-worker
  template:
    metadata:
      labels:
        app: incidentreport-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: incidentreport-app
          imagePullPolicy: IfNotPresent
          args: [dist/database/migrate.js]
          envFrom:
            - configMapRef:
                name: incidentreport-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: DATABASE_URL
                  optional: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: worker
          image: incidentreport-app
          imagePullPolicy: IfNotPresent
          args: [dist/services/temporal-worker/src/worker.js]
          envFrom:
            - configMapRef:
                name: incidentreport-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: DATABASE_URL
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: GOOGLE_API_KEY
                  optional: true
          # No fake HTTP readiness probe: this worker exposes no health server.
          # Verify polling with logs and a complete incident workflow.
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
