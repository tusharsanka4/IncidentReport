apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentreport-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: incidentreport-api
  template:
    metadata:
      labels:
        app: incidentreport-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Migrations are transactional and protected by a PostgreSQL advisory lock.
      # Every replica must complete them before its application process starts.
      initContainers:
        - name: migrate
          image: incidentreport-app
          imagePullPolicy: IfNotPresent
          args: [dist/database/migrate.js]
          envFrom:
            - configMapRef:
                name: incidentreport-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: DATABASE_URL
                  optional: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: incidentreport-app
          imagePullPolicy: IfNotPresent
          args: [dist/services/api/src/index.js]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: incidentreport-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: DATABASE_URL
                  optional: true
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /ready/workflow, port: http}
            periodSeconds: 5
            timeoutSeconds: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incidentreport-api
spec:
  type: ClusterIP
  selector:
    app: incidentreport-api
  ports:
    - name: http
      port: 3000
      targetPort: http
