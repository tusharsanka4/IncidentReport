apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  clusterIP: None
  selector:
    app: incidentreport-temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: ui
      port: 8233
      targetPort: ui
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal
spec:
  serviceName: temporal
  # The SQLite development server must never be scaled above one replica.
  replicas: 1
  selector:
    matchLabels:
      app: incidentreport-temporal
  template:
    metadata:
      labels:
        app: incidentreport-temporal
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/temporal:1.9.1
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --namespace
            - $(TEMPORAL_NAMESPACE)
            - --db-filename
            - /data/temporal.db
          env:
            - name: TEMPORAL_NAMESPACE
              valueFrom:
                configMapKeyRef: {name: incidentreport-config, key: TEMPORAL_NAMESPACE}
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
          startupProbe:
            exec:
              command: [temporal, --address, '127.0.0.1:7233', operator, cluster, health]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [temporal, --address, '127.0.0.1:7233', operator, cluster, health]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
