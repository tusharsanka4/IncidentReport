apiVersion: batch/v1
kind: Job
metadata:
  name: incidentreport-seed
  namespace: incidentreport
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: incidentreport-app:local
          imagePullPolicy: IfNotPresent
          args: [dist/database/seeds/seed.js]
          envFrom:
            - configMapRef:
                name: incidentreport-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: incidentreport-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: incidentreport-secrets
                  key: DATABASE_URL
                  optional: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
