openapi: 3.0.3
info:
  title: Groq chat completion test contract
  version: 1.0.0
  description: Narrow local contract for the structured-output call used by this repository, not the complete Groq API.
servers:
  - url: https://api.groq.com/openai/v1
paths:
  /chat/completions:
    post:
      operationId: completeIncidentAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages, response_format]
              properties:
                model: {type: string}
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {type: string}
                      content: {type: string}
                response_format:
                  type: object
                  required: [type, json_schema]
                  properties:
                    type: {type: string, enum: [json_schema]}
                    json_schema: {type: object}
      responses:
        '200':
          description: A non-streaming chat completion containing schema-valid JSON text.
          content:
            application/json:
              schema:
                type: object
                required: [id, object, created, model, choices]
                properties:
                  id: {type: string}
                  object: {type: string, enum: [chat.completion]}
                  created: {type: integer}
                  model: {type: string}
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        finish_reason: {type: string}
                        message:
                          type: object
                          properties:
                            role: {type: string}
                            content: {type: string}
